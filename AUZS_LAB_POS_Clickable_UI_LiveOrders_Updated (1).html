<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>AUZS LAB POS — Clickable Prototype</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#fff; --surface-2:#f0f2f5; --line:#e5e7eb;
  --text:#13161b; --muted:#737983; --brand:#1f55ff; --brand-2:#102a72;
  --green:#1ea672; --red:#dd4d4d; --amber:#d99100; --shadow:0 8px 28px rgba(15,23,42,.06);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:258px;background:#fbfbfc;border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;transition:.25s;width:min(258px,29vw);min-width:228px}
.brand{display:flex;align-items:center;gap:12px;padding:8px 8px 18px}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#111827,#4b5563);color:#fff;display:grid;place-items:center;font-weight:900;letter-spacing:-2px}
.brand b{font-size:16px}.brand span{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.nav{overflow:auto;padding-right:2px}
.nav-section-title{font-size:11px;color:#9aa0aa;text-transform:uppercase;letter-spacing:.1em;padding:14px 10px 7px}
.nav-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 11px;border:0;background:transparent;border-radius:11px;color:#454a53;text-align:left;margin:2px 0;position:relative}
.nav-btn:hover{background:#f0f2f5}
.nav-btn.active{background:#eaf0ff;color:#1543cc;font-weight:700}
.nav-btn .ico{width:18px;text-align:center;color:#6d747f}
.nav-btn.active .ico{color:#1543cc}
.nav-btn .chev{margin-left:auto;font-size:11px;color:#8e949f}
.nav-sub{display:none;margin:3px 0 6px 34px;padding-left:10px;border-left:1px solid #e0e3e7}
.nav-sub.open{display:block}
.nav-sub button{width:100%;border:0;background:transparent;text-align:left;padding:8px 8px;color:#6c727c;border-radius:8px;font-size:13px}
.nav-sub button:hover,.nav-sub button.active{background:#f0f2f5;color:#111827}
.badge{margin-left:auto;background:#eef3ff;color:#3b67de;font-size:10px;padding:2px 6px;border-radius:999px}
.sidebar-bottom{margin-top:auto;padding-top:12px}
.help-card{padding:14px;border:1px solid var(--line);background:#fff;border-radius:14px;box-shadow:var(--shadow)}
.help-card b{font-size:13px}.help-card p{font-size:11px;color:var(--muted);line-height:1.45}.dark-btn{background:#111827;color:#fff;border:0;border-radius:10px;padding:9px 11px;width:100%;font-weight:700}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:70px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;position:relative;z-index:5}
.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:11px;display:grid;place-items:center;color:#525862}
.outlet{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:11px;font-weight:700}
.outlet small{font-weight:500;color:var(--muted)}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:7px;font-size:12px;color:#5a6069}
.dot{width:8px;height:8px;background:var(--green);border-radius:50%}
.top-actions{display:flex;gap:8px}
.content{padding:22px;overflow:auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}
.page-head h1{font-size:24px;margin:0 0 5px;letter-spacing:-.02em}
.page-head p{margin:0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:650;color:#30353c}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.ghost{background:#f7f8fa}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(5,minmax(140px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.kpi-label{color:var(--muted);font-size:12px}.kpi-value{font-size:25px;font-weight:800;margin:8px 0}.trend{font-size:11px}.up{color:var(--green)}.down{color:var(--red)}
.dashboard-grid{grid-template-columns:1.4fr 1fr .9fr}
.card h3{margin:0 0 12px;font-size:14px}.subtle{color:var(--muted);font-size:12px}
.chart{height:190px;position:relative;margin-top:10px}
.chart svg{width:100%;height:100%}
.channel-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f0f1f3}.channel-row:last-child{border-bottom:0}
.pill{font-size:10px;padding:4px 7px;border-radius:999px;background:#f3f5f8;color:#5f6670}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 9px;border-bottom:1px solid #eef0f2;text-align:left;font-size:12px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#848a95}
tr:hover td{background:#fafbfc}
.status-pill{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:700}
.s-green{background:#e9f8f1;color:#167853}.s-blue{background:#eaf0ff;color:#1b4bd2}.s-amber{background:#fff5dc;color:#8b6100}.s-red{background:#ffeded;color:#a33434}
.two-col{grid-template-columns:1.5fr 1fr}
.three-col{grid-template-columns:repeat(3,1fr)}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf0f2}.list-item:last-child{border-bottom:0}
.progress{height:7px;background:#edf0f3;border-radius:999px;overflow:hidden;margin-top:8px}.progress > span{display:block;height:100%;background:var(--brand);border-radius:999px}
.filterbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.input,.select{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 11px;min-width:150px;outline:none}
.input:focus,.select:focus{border-color:#9db2ff;box-shadow:0 0 0 3px #eaf0ff}
.empty{padding:38px 15px;text-align:center;color:var(--muted)}
.empty b{color:var(--text);display:block;margin-bottom:4px}
.quick-grid{grid-template-columns:repeat(4,minmax(160px,1fr))}
.quick{padding:14px;border:1px solid var(--line);background:#fff;border-radius:14px;text-align:left}
.quick b{display:block;margin-bottom:5px}.quick span{font-size:11px;color:var(--muted)}
.footer-note{font-size:11px;color:#9298a2;padding:18px 0 4px}
.modal-wrap{display:none;position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:20;align-items:center;justify-content:center;padding:20px}
.modal-wrap.open{display:flex}
.modal{width:min(560px,96vw);background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.18);padding:20px}
.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{font-size:18px;margin:0}.close{border:0;background:#f1f3f5;border-radius:9px;width:34px;height:34px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 10px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:11px 14px;border-radius:11px;font-size:12px;display:none;z-index:30;box-shadow:0 14px 36px rgba(0,0,0,.22)}
.toast.show{display:block;animation:fade 2.8s forwards}@keyframes fade{0%,72%{opacity:1}100%{opacity:0}}

 em{font-style:normal;font-size:11px}.no-recipe{background:#eff1f4;border-radius:999px;padding:6px 8px;text-align:center;font-size:10px;color:#4f5660}.inventory-note{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#f1f2f3;border:1px solid #e0e2e5;border-radius:15px;padding:16px}.inventory-note div{display:flex;flex-direction:column;gap:4px}.inventory-note b{font-size:13px}.inventory-note span{font-size:11px;color:#6e7680}.outline{border-color:#3477ea!important;color:#2066d5!important;background:#fff!important}.bottom-two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.item-card,.expenses-card{min-height:285px;padding:15px}.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid #dae0e6;border-radius:10px;overflow:hidden}.seg button{padding:10px;border:0;background:#fff;color:#555e68}.seg button+button{border-left:1px solid #dae0e6}.seg .active{background:#f3f7ff;color:#1d69db;font-weight:700}.item-empty{padding:58px 20px 24px}.item-empty span{font-size:11px;line-height:1.4}.exp-row{display:flex;justify-content:space-between;margin-top:16px;font-size:12px}.exp-bar{height:7px;border-radius:999px;background:#eceff1;margin-top:8px}.snapshot-card{padding:0;overflow:hidden}.snap-graph{height:145px;position:relative;border-bottom:1px solid #e4e7eb}.snap-graph svg{width:100%;height:100%}.snap-graph>span{position:absolute;left:32px;top:18px;background:#eaf1ff;color:#1767df;padding:5px 13px;border-radius:999px;font-size:12px;font-weight:700}.snap-copy{display:flex;justify-content:space-between;align-items:center;padding:14px 15px}.snap-copy div{display:flex;flex-direction:column;gap:4px}.snap-copy small{font-size:11px;color:#727a84}.trial{border:1px solid #f0bb45;background:#fffaf0;border-radius:15px;padding:17px;color:#74551e}.trial p{font-size:13px;line-height:1.45;margin:0 0 10px}.trial button{border:0;background:none;color:#694b16;font-weight:700;float:right}.attendo{border-radius:15px;border:1px solid #dce8f7;background:#eaf <body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">A</div>
      <div><b>AUZS LAB</b><span>POS Control Center</span></div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="sidebar-bottom">
      <div class="help-card">
        <b>AUZS Pro</b>
        <p>Unlock advanced reports, automation and integrations.</p>
        <button class="dark-btn" onclick="toast('Upgrade flow opened')">View plans</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" title="Toggle sidebar" onclick="toggleSidebar()">☰</button>
      <button class="outlet" onclick="openModal('outletModal')">▣ <span>Mannat Cafe</span> <small>⌄</small></button>
      <span class="pill">OPEN</span>
      <div class="status"><span class="dot"></span> POS connected</div>
      <div class="spacer"></div>
      <div class="top-actions">
        <button class="icon-btn" title="Device Mapping" onclick="go('management','Device Mapping')">◫</button>
        <button class="icon-btn" title="Notifications" onclick="toast('No new notifications')">♧</button>
        <button class="icon-btn" title="Settings" onclick="go('management','Configuration')">⚙</button>
        <button class="btn primary" onclick="toast('App marketplace opened')">✦ Discover Apps</button>
      </div>
    </header>

    <section class="content" id="content"></section>
  </main>
</div>

<div class="modal-wrap" id="modal">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">Create</h2><button class="close" onclick="closeModal()">×</button></div>
    <div id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="closeModal();toast('Saved successfully')">Save</button>
    </div>
  </div>
</div>
<div class="modal-wrap" id="outletModal">
  <div class="modal">
    <div class="modal-head"><h2>Select outlet</h2><button class="close" onclick="document.getElementById('outletModal').classList.remove('open')">×</button></div>
    <div class="list-item"><div><b>Mannat Cafe</b><div class="subtle">Main outlet</div></div><span class="status-pill s-green">Open</span></div>
    <div class="list-item"><div><b>AUZS Demo Store</b><div class="subtle">Demo outlet</div></div><span class="status-pill s-blue">Select</span></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const navData = [
  {id:'dashboard',label:'Dashboard',icon:'⌂'},
  {id:'daily',label:'Daily Operations',icon:'◴',children:[
    ['live','Live Orders'],['all','All Orders'],['online','Online Orders'],['kot','KOT'],['due','Due Payment']
  ]},
  {id:'menu',label:'Menu Management',icon:'☷',children:[

function renderNav(){
  const nav=document.getElementById('nav'); nav.innerHTML='';
  navData.forEach(item=>{
    if(!item.children){
      nav.innerHTML += `<button class="nav-btn" data-id="${item.id}" onclick="go('${item.id}')"><span class="ico">${item.icon}</span><span>${item.label}</span></button>`;
      return;
    }
    nav.innerHTML += `<button class="nav-btn parent" data-id="${item.id}" onclick="toggleParent('${item.id}')"><span class="ico">${item.icon}</span><span>${item.label}</span>${item.badge?`<span class="badge">${item.badge}</span>`:''}<span class="chev" id="chev-${item.id}">›</span></button>`;
    nav.innerHTML += `<div class="nav-sub" id="sub-${item.id}">${item.children.map(ch=>`<button data-page="${ch[0]}" onclick="go('${item.id}','${ch[0]}')">${ch[1]}</button>`).join('')}</div>`;
  });
}
function toggleParent(id){
  const sub=document.getElementById('sub-'+id); const open=sub.classList.toggle('open');
  document.getElementById('chev-'+id).textContent=open?'⌄':'›';
}
function setActive(id,sub){
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-sub button').forEach(x=>x.classList.remove('active'));
  const parent=document.querySelector(`.nav-btn[data-id="${id}"]`); if(parent) parent.classList.add('active');
  if(sub){
    const s=document.getElementById('sub-'+id); if(s&&!s.classList.contains('open')){s.classList.add('open'); document.getElementById('chev-'+id).textContent='⌄'}
    const btn=document.querySelector(`.nav-sub button[data-page="${sub}"]`); if(btn) btn.classList.add('active');
  }
}

 if(type==='inventory') return `<thead><tr><th>Item</th><th>Unit</th><th>On Hand</th><th>Reorder Level</th><th>Status</th><th></th></tr></thead><tbody>${[['Milk','L','38','20','Healthy'],['Paneer','Kg','12','15','Reorder'],['Coffee Beans','Kg','7','5','Healthy'],['Potato','Kg','42','30','Healthy']].map(r=>`<tr>${r.slice(0,4).map(c=>`<td>${c}</td>`).join('')}<td><span class="status-pill ${r[4]==='Healthy'?'s-green':'s-amber'}">${r[4]}</span></td><td><button class="btn" style="padding:5px 8px" onclick="toast('Item opened')">Open</button></td></tr>`).join('')}</tbody>`;
 if(type==='finance') return `<thead><tr><th>Entry</th><th>Category</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody>${[['Rent','Fixed Cost','01 Oct 2026','₹ 15,000','Posted'],['Cash withdrawal','Cash','01 Oct 2026','₹ 2,000','Posted'],['Supplier payment','Inventory','30 Sep 2026','₹ 6,500','Pending']].map(r=>`<tr>${r.slice(0,4).map(c=>`<td>${c}</td>`).join('')}<td><span class="status-pill ${r[4]==='Posted'?'s-green':'s-amber'}">${r[4]}</span></td></tr>`).join('')}</tbody>`;
 if(type==='reports') return `<thead><tr><th>Report</th><th>Period</th><th>Generated</th><th>Action</th></tr></thead><tbody>${[['Daily Sales','Today','Ready'],['Channel Mix','Today','Ready'],['Item Performance','This Month','Ready'],['Customer Growth','This Month','Ready']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td><span class="status-pill s-green">${r[2]}</span></td><td><button class="btn" style="padding:5px 8px" onclick="toast('Report opened')">View</button></td></tr>`).join('')}</tbody>`;
 return `<thead><tr><th>Name</th><th>Owner</th><th>Updated</th><th>Status</th><th></th></tr></thead><tbody>${[['Primary record','Manager','Today','Active'],['Secondary record','Admin','Yesterday','Active'],['Archived record','Admin','28 Sep 2026','Archived']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td><span class="status-pill ${r[3]==='Active'?'s-green':'s-amber'}">${r[3]}</span></td><td><button class="btn" style="padding:5px 8px" onclick="toast('Opened')">Open</button></td></tr>`).join('')}</tbody>`;
}
function go(id,sub=null,liveTab='orders'){
 setActive(id,sub);
 document.getElementById('content').innerHTML =
   id==='dashboard' ? renderDashboard() :
   (id==='daily' && sub==='live') ? renderLiveOrders(liveTab) :
   genericPage(id,sub);
 if(id!=='dashboard' && window.innerWidth<760) document.getElementById('sidebar').classList.remove('mobile-open');
}
function openCreate(title,label){
 document.getElementById('modalTitle').textContent=label+' • '+title;
 document.getElementById('modalBody').innerHTML=`<div class="form-grid">
   <div class="field"><label>Name / Reference</label><input placeholder="Enter ${label.toLowerCase()} name"></div>
   <div class="field"><label>Status</label><select><option>Active</option><option>Pending</option><option>Draft</option></select></div>
   <div class="field"><label>Notes</label><input placeholder="Optional notes"></div>
   <div class="field"><label>Amount</label><input placeholder="₹ 0"></div>
 </div>`;
 document.getElementById('modal').classList.add('open');
}
function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function filterTable(q){q=(q||'').toLowerCase();document.querySelectorAll('#dataTable tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
renderNav(); go('dashboard');
</script>
</body>
</html>
